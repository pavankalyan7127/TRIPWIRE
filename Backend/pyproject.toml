[tool.poetry]
name = "tripwire-backend"
version = "0.1.0"
description = "Tripwire — Runtime security harness for AI agents (backend)"
authors = []
readme = "CLAUDE.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.115"
uvicorn = {extras = ["standard"], version = ">=0.30"}
pydantic = ">=2.0"
pydantic-settings = ">=2.0"
sqlalchemy = ">=2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
httpx = ">=0.27"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
